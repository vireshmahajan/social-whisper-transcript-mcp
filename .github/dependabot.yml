# Weekly PRs for dependency updates; CI tests each one before you merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-deps: { patterns: ["*"] }
    ignore:
      # mcp 2.x renamed FastMCP and changed APIs: migrate by hand, not via a bump PR
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
